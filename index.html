<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Deivid Vasconcelos — Física &amp; escrita</title>
  <meta name="description" content="Espaço autoral de Deivid Vasconcelos. O Céu interativo, escritos de Tonares (Caderno do Cais) e notas de Física.">
  <meta name="author" content="Deivid Vasconcelos">
  <meta name="theme-color" content="#0c1020" id="meta-theme-color">

  <!-- Metadados para compartilhamento (WhatsApp, Instagram, Telegram, X) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Deivid Vasconcelos — Física &amp; escrita">
  <meta property="og:description" content="O Céu interativo e Caderno do Cais, por Tonares.">
  <meta property="og:image" content="capa-social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Deivid Vasconcelos — Física &amp; escrita">
  <meta name="twitter:description" content="O Céu interativo e Caderno do Cais, por Tonares.">
  <meta name="twitter:image" content="capa-social.png">

  <!-- Ícone da aba -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Tipografia editorial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">

  <!-- Folhas de estilo modulares -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="ambientes.css">
</head>
<body data-modo="ceu">

  <!-- Camadas atmosféricas -->
  <div class="atmosfera atmosfera-ceu" aria-hidden="true"></div>
  <div class="atmosfera atmosfera-intervalo" aria-hidden="true"></div>
  <canvas id="ceu" aria-hidden="true"></canvas>
  <div class="grao-estatico" id="grao-estatico" aria-hidden="true"></div>

  <!-- Navegação editorial -->
  <nav class="nav-barra" aria-label="Navegação principal">
    <div class="nav-links">
      <button type="button" class="nav-btn ativo" id="btn-ceu" aria-current="page">O Céu</button>
      <button type="button" class="nav-btn" id="btn-intervalo">Intervalo</button>
      <span class="nav-btn desativado" id="nav-notas-status" aria-disabled="true" title="Em preparação">
        Notas, Física &amp; Arquivos <small class="tag-breve">em breve</small>
      </span>
    </div>

    <button type="button" class="nav-btn btn-som" id="btn-som" aria-pressed="false" title="Alternar som ambiente">
      som: off
    </button>
  </nav>

  <!-- Ambiente 1: O Céu -->
  <section class="vista-ceu" id="vista-ceu" aria-labelledby="titulo-ceu">
    <header class="topo-ceu">
      <h1 id="titulo-ceu">Deivid Vasconcelos</h1>
      <p class="sub">Física &amp; escrita.</p>
    </header>

    <div class="base-ceu">
      <p class="contador" id="contador" aria-live="polite" aria-atomic="true"></p>
      <p class="dica" id="dica">Toque no céu.</p>

      <button type="button" class="portal-intervalo" id="btn-abrir-intervalo">
        <span class="portal-sub">Caderno do Cais</span>
        <span>Intervalo →</span>
      </button>

      <footer class="rodape-ceu">
        <p class="direitos">© 2026 Deivid Vasconcelos. Todos os direitos reservados.</p>
      </footer>
    </div>
  </section>

  <!-- Ambiente 2: Intervalo — Tonares -->
  <section class="vista-intervalo" id="vista-intervalo" aria-label="Intervalo, por Tonares" hidden>
    <main class="intervalo-main" id="intervalo-container"></main>
    <button type="button" class="sair-print-dica" id="btn-sair-print">toque para sair do modo print</button>
  </section>

  <!-- Motor modular do site -->
  <script type="module" src="app.js"></script>
</body>
</html>
